aid: wombo
name: Wombo
description: >-
  Wombo is the AI company behind Dream by WOMBO, a consumer AI art and video
  generator, and w.ai, a decentralized AI supercomputer that pools idle GPU
  compute worldwide to serve affordable on-demand inference. The w.ai developer
  platform exposes an OpenAI-compatible HTTP API at api.w.ai/v1 covering model
  discovery, text and vision-language chat completions with tool calling and
  streaming, text-to-image generation and editing (FLUX, SDXL), and object
  detection and segmentation (YOLO11n, SAM2) over images and video, plus a `wai`
  CLI and rentable Jupyter/SSH compute environments. Backed by 500 Global.
